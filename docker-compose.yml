services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-chatbot-clima
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      # Permite usar $env.OPENWEATHER_API_KEY nas expressões dos nós
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # URL pública HTTPS (ngrok, cloudflared...) exigida pelo webhook do Telegram
      - WEBHOOK_URL=${WEBHOOK_URL}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
